<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Avanzada de Profesores</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .form-group {
            position: relative;
            margin-bottom: 15px;
        }

        .form-group i {
            position: absolute;
            top: 40px;
            left: 12px;
            color: var(--text-muted);
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        button.btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        button.btn-submit:hover {
            background-color: var(--primary-hover);
        }

        button.btn-submit:active {
            transform: scale(0.98);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: var(--text-muted);
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        /* Notificaciones Toast flotantes */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #ffffff;
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-left: 5px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
            font-size: 0.9rem;
        }

        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(10px); }
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <nav style="background-color: #1e293b; padding: 1rem 2rem; display: flex; gap: 1rem; align-items: center; border-radius: 8px; margin-bottom: 2rem;">
    <a href="index.html" style="color: #60a5fa; text-decoration: none; font-weight: bold;">🏠 Inicio</a>
    <span style="color: #475569;">|</span>
    <a href="profesores.html" style="color: white; text-decoration: none;">👨‍🏫 Profesores</a>
    <a href="cursos.html" style="color: white; text-decoration: none;">📚 Cursos</a>
    <a href="estudiantes.html" style="color: white; text-decoration: none;">🎓 Estudiantes</a>
    </nav>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-chalkboard-user" style="color: var(--primary);"></i> Gestión de Profesores</h1>
            <p>Panel de control para registro y control de docentes en tiempo real</p>
        </header>

        <div class="grid-layout">
            <!-- Formulario -->
            <div class="card">
                <h2><i class="fa-solid fa-user-plus"></i> Registrar</h2>
                <form id="form-profesor">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="nombre" placeholder="Ej. Carlos" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <i class="fa-solid fa-user-tag"></i>
                        <input type="text" id="apellido" placeholder="Ej. Gómez" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="especialidad">Especialidad</label>
                        <i class="fa-solid fa-graduation-cap"></i>
                        <input type="text" id="especialidad" placeholder="Ej. Matemáticas" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="carlos@correo.com" required>
                    </div>
                    
                    <button type="submit" class="btn-submit" id="btn-guardar">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Profesor
                    </button>
                </form>
            </div>

            <!-- Listado -->
            <div class="card">
                <h2><i class="fa-solid fa-list"></i> Listado de Profesores</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Especialidad</th>
                                <th>Email</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-profesores">
                            <tr>
                                <td colspan="5" class="empty-state">Cargando profesores...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor para Alertas flotantes -->
    <div id="toast-container"></div>

    <!-- Vinculamos el archivo JavaScript -->
    <script src="js/profesores.js"></script>
</body>
</html>
