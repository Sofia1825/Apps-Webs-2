<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Profesores</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        form { margin-bottom: 30px; max-width: 400px; }
        input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Registrar Nuevo Profesor</h2>
    <!-- Formulario para el FETCH(POST) -->
    <form id="form-profesor">
        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="text" id="apellido" placeholder="Apellido" required>
        <input type="text" id="especialidad" placeholder="Especialidad" required>
        <input type="email" id="email" placeholder="Correo Electrónico" required>
        <button type="submit">Guardar Profesor</button>
    </form>

    <h2>Listado de Profesores</h2>
    <!-- Tabla para el FETCH(GET) -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Especialidad</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="tabla-profesores">
            <!-- Los datos se cargarán aquí dinámicamente con JS -->
        </tbody>
    </table>

    <!-- Vinculamos el archivo JavaScript -->
    <script src="js/profesores.js"></script>
</body>
</html>
